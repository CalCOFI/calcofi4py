# Build the mkdocs site and push it to the gh-pages branch (the Python pkgdown).
# GitHub Pages serves that branch at https://calcofi.io/calcofi4py/.
name: docs
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # articles under docs/articles/ are pre-rendered notebooks (scripts/render_articles.sh);
      # mkdocs-jupyter publishes their stored outputs — no database credentials here, by design
      - run: pip install -e ".[docs]"
      - run: mkdocs gh-deploy --force --no-history
