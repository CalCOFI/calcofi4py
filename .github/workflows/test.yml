name: test
on:
  push: {branches: [main]}
  pull_request:
  # the release pipeline (CalCOFI/workflows test_release.qmd) dispatches this after promoting a
  # release, so the README examples re-run against the new latest
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
