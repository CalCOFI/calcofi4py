# Documentation site for calcofi4py — the Python "pkgdown": mkdocs-material +
# mkdocstrings render the package docstrings into an API reference. Built and
# deployed to the gh-pages branch by .github/workflows/docs.yml on every push to
# main; served at https://calcofi.io/calcofi4py/ (CalCOFI org Pages domain).
site_name: calcofi4py
site_url: https://calcofi.io/calcofi4py/
site_description: CalCOFI Python helpers — public database releases (DuckDB over Parquet) and the CTD team's PostgreSQL working database
repo_url: https://github.com/CalCOFI/calcofi4py
repo_name: CalCOFI/calcofi4py
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # dark by default (first palette entry), light one toggle away
  palette:
    - scheme: slate
      primary: custom
      accent: yellow
      toggle: {icon: material/brightness-7, name: light mode}
    - scheme: default
      primary: custom
      accent: indigo
      toggle: {icon: material/brightness-4, name: dark mode}
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Articles:
      - CTD QA/QC walkthrough: articles/ctd-qaqc.ipynb
  - API reference: reference.md

plugins:
  - search
  # articles = pre-rendered notebooks (the R "precomputed vignette"): scripts/render_articles.sh
  # executes articles/*.qmd locally through the author's tunnel + ~/.pgpass and commits the
  # executed .ipynb; the site build only publishes stored outputs, so CI holds no credentials.
  - mkdocs-jupyter:
      execute: false
      include_source: true
      theme: dark
      remove_tag_config:
        remove_input_tags: [hide-input]
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_root_full_path: false     # cc_get_db, not calcofi4py.release.cc_get_db
            heading_level: 3               # functions sit UNDER the ## section headings
            members_order: source
            separate_signature: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: {permalink: true}

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CalCOFI
    - icon: material/web
      link: https://calcofi.io
